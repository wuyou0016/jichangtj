<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t d">
  <title id="t">设备数的三种常见计数口径示意图</title>
  <desc id="d">按同时在线的出口 IP、按同时打开的连接数、按设备标识三种方式计数，同一个家庭网络下的结果可能不同。</desc>
  <rect width="720" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="360" y="32" font-size="17" font-weight="700" fill="#0f172a">“最多 3 台设备”可能怎么数（示意）</text>

    <rect x="16" y="52" width="224" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="128" y="80" font-size="15" font-weight="700" fill="#1d4ed8">按同时在线的出口 IP</text>
    <rect x="44" y="98" width="46" height="30" rx="6" fill="#e0e7ff" stroke="#1d4ed8"/><text x="67" y="118" font-size="11" fill="#0f172a">手机</text>
    <rect x="100" y="98" width="46" height="30" rx="6" fill="#e0e7ff" stroke="#1d4ed8"/><text x="123" y="118" font-size="11" fill="#0f172a">电脑</text>
    <rect x="156" y="98" width="46" height="30" rx="6" fill="#e0e7ff" stroke="#1d4ed8"/><text x="179" y="118" font-size="11" fill="#0f172a">平板</text>
    <path d="M67 130 L123 150 M123 130 L123 150 M179 130 L123 150" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="86" y="150" width="74" height="26" rx="13" fill="#fffbeb" stroke="#d97706"/><text x="123" y="168" font-size="11" fill="#0f172a">同一个出口 IP</text>
    <text x="128" y="204" font-size="12" fill="#475569">家庭 Wi-Fi 下多台设备</text>
    <text x="128" y="222" font-size="12" fill="#475569">常共用一个出口，可能算一个</text>

    <rect x="248" y="52" width="224" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="360" y="80" font-size="15" font-weight="700" fill="#1d4ed8">按同时打开的连接数</text>
    <g stroke="#475569" stroke-width="1.5">
      <line x1="278" y1="104" x2="440" y2="104"/><line x1="278" y1="116" x2="440" y2="116"/><line x1="278" y1="128" x2="440" y2="128"/><line x1="278" y1="140" x2="440" y2="140"/><line x1="278" y1="152" x2="440" y2="152"/><line x1="278" y1="164" x2="440" y2="164"/>
    </g>
    <text x="360" y="190" font-size="11" fill="#475569">一台设备开很多下载任务也会累计</text>
    <text x="360" y="212" font-size="12" fill="#475569">设备不多，也可能触发限制</text>
    <text x="360" y="230" font-size="12" fill="#475569">与“几台设备”不是一回事</text>

    <rect x="480" y="52" width="224" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="592" y="80" font-size="15" font-weight="700" fill="#1d4ed8">按设备标识</text>
    <rect x="520" y="98" width="62" height="30" rx="6" fill="#e0e7ff" stroke="#1d4ed8"/><text x="551" y="118" font-size="11" fill="#0f172a">标识 A</text>
    <rect x="600" y="98" width="62" height="30" rx="6" fill="#e0e7ff" stroke="#1d4ed8"/><text x="631" y="118" font-size="11" fill="#0f172a">标识 B</text>
    <rect x="560" y="140" width="82" height="26" rx="13" fill="#fffbeb" stroke="#d97706"/><text x="601" y="158" font-size="11" fill="#0f172a">重装后可能变化</text>
    <text x="592" y="204" font-size="12" fill="#475569">客户端上报的标识</text>
    <text x="592" y="222" font-size="12" fill="#475569">换客户端、重装系统会影响计数</text>

    <text x="360" y="266" font-size="11" fill="#64748b">示意图：具体口径因服务商而异，以套餐条款和客服答复为准</text>
  </g>
</svg>
